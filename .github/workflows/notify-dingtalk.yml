name: 钉钉通知（可复用）

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      actor:
        required: true
        type: string
      ref_name:
        required: false
        type: string
        default: ''
      commit_message:
        required: false
        type: string
        default: ''
      commit_url:
        required: false
        type: string
        default: ''
      pr_title:
        required: false
        type: string
        default: ''
      pr_url:
        required: false
        type: string
        default: ''
      pr_action:
        required: false
        type: string
        default: ''
      pr_merged:
        required: false
        type: string
        default: 'false'
      pr_base:
        required: false
        type: string
        default: ''
    secrets:
      DINGTALK_WEBHOOK_URL:
        required: true
      DINGTALK_SIGN_SECRET:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送钉钉通知
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SIGN_SECRET: ${{ secrets.DINGTALK_SIGN_SECRET }}
          EVENT_NAME: ${{ inputs.event_name }}
          REPO_NAME: ${{ inputs.repo_name }}
          ACTOR: ${{ inputs.actor }}
          REF_NAME: ${{ inputs.ref_name }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          COMMIT_URL: ${{ inputs.commit_url }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_URL: ${{ inputs.pr_url }}
          PR_ACTION: ${{ inputs.pr_action }}
          PR_MERGED: ${{ inputs.pr_merged }}
          PR_BASE: ${{ inputs.pr_base }}
        run: |
          echo '' | base64 -d > /tmp/notify.py
          python3 /tmp/notify.py
